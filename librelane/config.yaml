- dir::../otUSB/src/other_prim/prim_onehot_check.sv
- dir::../otUSB/src/other_prim/prim_xnor2.sv
- dir::../otUSB/src/other_prim/prim_reg_we_check.sv
- dir::../otUSB/src/prim_cdc/prim_cdc_rand_delay.sv
- dir::../otUSB/src/prim_flop/prim_flop.sv
- dir::../otUSB/src/prim_flop/prim_sparse_fsm_flop.sv
- dir::../otUSB/src/prim_flop/prim_flop_2sync.sv
- dir::../otUSB/src/prim_count/prim_count_pkg.sv
- dir::../otUSB/src/prim_count/prim_count.sv
- dir::../otUSB/src/prim_sec/prim_sec_anchor_buf.sv
- dir::../otUSB/src/prim_sec/prim_sec_anchor_flop.sv
- dir::../otUSB/src/other_prim/prim_diff_decode.sv
- dir::../otUSB/src/other_prim/prim_edge_detector.sv
- dir::../otUSB/src/other_prim/prim_filter.sv
- dir::../otUSB/src/prim_sync/prim_sync_reqack.sv
- dir::../otUSB/src/prim_sync/prim_pulse_sync.sv
- dir::../otUSB/src/prim_cdc/prim_reg_cdc_arb.sv
- dir::../otUSB/src/prim_cdc/prim_reg_cdc.sv
- dir::../otUSB/src/prim_fifo/prim_fifo_assert.svh
- dir::../otUSB/src/prim_fifo/prim_fifo_sync_cnt.sv
- dir::../otUSB/src/prim_fifo/prim_fifo_sync.sv
- dir::../otUSB/src/prim_subreg/prim_subreg_pkg.sv
- dir::../otUSB/src/prim_subreg/prim_subreg_ext.sv
- dir::../otUSB/src/prim_subreg/prim_subreg_arb.sv
- dir::../otUSB/src/prim_subreg/prim_subreg.sv
- dir::../otUSB/src/usb_consts_pkg.sv
- dir::../otUSB/src/usb_fs_nb_out_pe.sv
- dir::../otUSB/src/usb_fs_nb_in_pe.sv
- dir::../otUSB/src/usb_fs_rx.sv
- dir::../otUSB/src/usb_fs_tx.sv
- dir::../otUSB/src/usb_fs_tx_mux.sv
- dir::../otUSB/src/usb_fs_nb_pe.sv
- dir::../otUSB/src/usbdev_reg_pkg.sv
- dir::../otUSB/src/support_reg_hw_pkg.sv
- dir::../otUSB/src/usbdev_counter.sv
- dir::../otUSB/src/usbdev_linkstate.sv
- dir::../otUSB/src/usbdev_aon_wake.sv
- dir::../otUSB/src/usbdev_iomux.sv
- dir::../otUSB/src/usbdev_usbif.sv
- dir::../otUSB/src/bus_reg_pkg.sv
