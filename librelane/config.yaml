meta:
  version: 3
  flow: Chip
  substituting_steps:

    # Render the layout after sealring insertion
    KLayout.Render: null
    +KLayout.SealRing: KLayout.Render

    # Save time during development
    # Enable for sign-off
    #KLayout.DRC: null
    #Checker.KLayoutDRC: null
    #OpenROAD.IRDropReport: null
    #Magic.DRC: null
    #Checker.MagicDRC: null
    #KLayout.XOR: null
    #Netgen.LVS: null
    #Checker.LVS: null
    
    Checker.YosysSynthChecks: null  # Fails due to multisources in PLL

DESIGN_NAME: chip_top
VERILOG_FILES:
- dir::../src/chip_top.sv
- dir::../src/chip_core.sv

- dir::../otUSB/src/usb_wrapper.sv
- dir::../otUSB/src/prim_util/prim_util_pkg.sv
